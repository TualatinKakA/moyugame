<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111311">
  <link rel="icon" type="image/png" href="assets/images/cash.png">
  <title>无限工时 · R0～R3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="intro" id="intro">
    <section class="intro-card">
      <div class="eyebrow">ENDLESS SHIFT / R0—R3</div>
      <h1>无限工时</h1>
      <p class="quote">“只要完成 ¥100M 账面产值，就能解除劳动合同。”</p>
      <p>从一次点击 ¥0.1 开始。购买设施、选择部门、释放技能，并弄清这家公司究竟有多大。</p>
      <button class="primary" data-action="start">打卡入职</button>
      <small>本地自动存档 · 数值规则独立配置 · 无外部运行依赖</small>
    </section>
  </div>

  <header class="topbar">
    <div class="brand"><img src="assets/images/cash.png" alt=""><div><h1>无限工时</h1><small>ENDLESS SHIFT</small></div></div>
    <div class="rank" id="rankText">R0 · 地球试用期</div>
    <div class="top-actions"><span id="saveStatus">本地存档已就绪</span><button data-action="save">保存</button><button data-tab="more" id="moreTabButton">更多</button></div>
  </header>

  <section class="resource-bar">
    <div><small>可用工资</small><strong id="coins">¥ 0</strong></div>
    <div><small>每秒产出</small><strong id="production">¥ 0</strong></div>
    <div><small>期权</small><strong id="gems">0</strong></div>
    <div><small>影响力发现率</small><strong id="fcChance">10%</strong></div>
  </section>
  <section class="mana-bar" aria-label="精力">
    <div class="mana-copy"><span>精力</span><strong id="mana">0 / 1,000</strong><small id="manaRate">+1 / 秒</small></div>
    <div class="mana-track" role="progressbar" aria-label="当前精力" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="0" id="manaProgress"><div id="manaFill"></div></div>
  </section>

  <div class="app-layout">
    <aside class="left-rail">
      <nav class="app-nav" aria-label="游戏功能">
        <button class="mobile-nav" data-tab="buildings" aria-controls="mainPanel">设施</button>
        <button class="desktop-nav" data-tab="building-upgrades" aria-controls="mainPanel">设施升级</button>
        <button class="desktop-nav" data-tab="misc-upgrades" aria-controls="mainPanel">通用升级</button>
        <button class="mobile-nav" data-tab="upgrades" aria-controls="mainPanel">升级</button>
        <button data-tab="factions" aria-controls="mainPanel"><span class="desktop-label">部门升级</span><span class="mobile-label">部门</span></button>

        <button class="desktop-nav" data-tab="stats" aria-controls="mainPanel">统计</button>
      </nav>
      <section class="rail-shortcuts" aria-label="快捷升级">
        <div class="rail-section-head"><small>快捷升级</small><button data-tab="upgrades">全部</button></div>
        <div class="upgrade-icon-grid rail-upgrade-grid" id="upgradeRail"></div>
      </section>
    </aside>

    <main class="work-area" id="workArea">
      <div class="work-context"><small id="chapterName">地球 · 试用期</small><span id="factionName">尚未选择部门</span></div>
      <div id="retirementPanel"></div>
      <section class="work-summary" aria-label="本轮简要统计">
        <div><small>每次搬砖</small><strong id="clickReward">¥ 0</strong></div>
        <div><small>数字员工</small><strong id="assistants">0</strong></div>
        <div><small>本轮时间</small><strong id="runTime">00:00</strong></div>
      </section>
      <div class="work-content" id="workContent"></div>
      <section class="event-strip" aria-label="实时记录">
        <button data-action="toggle-log" id="logToggle" aria-expanded="false" aria-controls="eventLog">实时记录</button>
        <span id="latestLog">打卡成功。系统提示：请勿寻找公司的出口。</span>
        <section class="event-log" id="eventLog" aria-label="实时记录列表" hidden>
          <div class="event-log-head">
            <strong>实时记录</strong>
            <button type="button" data-action="close-log" id="logClose" aria-label="关闭实时记录">× 关闭</button>
          </div>
          <ul class="event-log-list" id="eventLogItems"></ul>
        </section>
      </section>
    </main>

    <aside class="facility-rail" id="facilityRail" aria-label="常驻设施采购"></aside>
  </div>
  <section class="main-panel panel-scroll" id="mainPanel" aria-label="辅助功能面板" tabindex="-1" hidden></section>

  <div class="toast" id="toast" role="status"></div>
  <input type="file" id="importFile" accept="application/json" hidden>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
