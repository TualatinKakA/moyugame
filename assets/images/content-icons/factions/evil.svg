<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>务实路线</title>
  <desc>一座封闭、厚重的工业堡垒式建筑，部分埋入地下。核心是一个巨大的纠结阀门与压力表，散发着压抑的橙红色危险光芒，缠绕着杂乱电缆，象征着冰冷的生存法则。</desc>
  
  <g id="fortress-body">
    <polygon fill="#46504F" points="10,20 54,20 58,28 58,56 6,56 6,28" />
    <polygon fill="#333B3A" points="10,20 54,20 50,24 14,24" />
    <polygon fill="#697473" points="6,28 58,28 54,32 10,32" />
    
    <polygon fill="#252A27" points="6,56 14,48 14,32 6,28" />
    <polygon fill="#252A27" points="58,56 50,48 50,32 58,28" />
  </g>
  
  <g id="pragmatic-core">
    
    <circle cx="32" cy="38" r="12" fill="#D9E2E2" stroke="#252A27" stroke-width="1" />
    
    <path d="M32,26 A12,12 0 0,1 44,38 L40,38 A8,8 0 0,0 32,30 Z" fill="#E84C4F" />
    
    <circle cx="32" cy="38" r="6" fill="#A5684A" />
    <polygon fill="#65402F" points="32,34 33,37 32,40 31,37" />
    <polygon fill="#65402F" points="36,38 33,37 30,38 33,39" />
    
    <line x1="32" y1="38" x2="42" y2="30" stroke="#252A27" stroke-width="1.5" stroke-linecap="round" />
  </g>
  
  <g id="cables-and-rust">
    <path d="M14,24 L14,52 L18,56" fill="none" stroke="#DF9A6C" stroke-width="1" />
    <path d="M50,24 L50,52 L46,56" fill="none" stroke="#C4764D" stroke-width="1" />
    
    <circle cx="20" cy="40" r="2" fill="#E84C4F" />
    <circle cx="44" cy="48" r="2" fill="#E84C4F" />
  </g>
</svg>